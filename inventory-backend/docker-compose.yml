version: '3.9'

services:
  api:
    build: .
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/inventory
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
